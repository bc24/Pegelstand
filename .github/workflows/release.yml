name: Release

# Baut bei Versions-Tags das Release-Zip samt Prüfsumme und legt ein GitHub-Release an.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  zip:
    name: Release-Zip bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Zip erstellen
        run: bin/build-release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: pegelstand-zip
          path: |
            dist/*.zip
            dist/*.sha256
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes --verify-tag
